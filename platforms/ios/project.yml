name: Waymate

options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  MotoNavigationCore:
    path: .

targets:
  Waymate:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Waymate.entitlements
      - path: ../../shared/ble_protocol/src/ble_protocol.cpp
      - path: ../../shared/coordinates/coordinates.cpp
      - path: ../../shared/nav_core/nav_core.cpp
      - path: ../../shared/nav_app/nav_app.cpp
      - path: ../../shared/protocol/fixtures/ble-navigation-v1.golden.txt
        buildPhase: resources
      - path: ../../shared/demo_fixture/jinan_map_scene_sample.json
        buildPhase: resources
      - path: ../../shared/offline_map/jinan-v1.sqlite
        buildPhase: resources
      - path: ../../NOTICE
        buildPhase: resources
      - path: ../../LICENSE.md
        buildPhase: resources
      - path: ../../THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: MotoNavigationCore
        product: MotoNavigationCore
      - sdk: libsqlite3.tbd
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WAYMATE
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        NSLocationWhenInUseUsageDescription: WAYMATE 需要定位来规划路线并更新骑行位置。
        NSLocationAlwaysAndWhenInUseUsageDescription: 导航开始后，WAYMATE 需要在锁屏或切换应用时继续更新骑行位置。
        NSBluetoothAlwaysUsageDescription: WAYMATE 使用蓝牙连接车把上的 ESP32-S3 圆屏设备。
        NSAppleMusicUsageDescription: WAYMATE 需要读取并控制 Apple Music 播放，以便在车把圆屏上切歌和暂停。
        NSPhotoLibraryAddUsageDescription: WAYMATE 需要将你分享的骑行卡片保存到相册。
        UIBackgroundModes:
          - location
          - bluetooth-central
        MOTOGPSGatewayBaseURL: https://example.invalid/moto-gps/api/
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: App/Waymate.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhengxiaohua.waymate.test2026
        PRODUCT_NAME: Waymate
        MARKETING_VERSION: 0.3.1
        CURRENT_PROJECT_VERSION: 6
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: targeted
        SWIFT_OBJC_BRIDGING_HEADER: App/Waymate-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../../shared/ble_protocol/include
          - $(SRCROOT)/../../shared/coordinates/include
          - $(SRCROOT)/../../shared
          - $(SRCROOT)/../../shared/nav_app/include
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R42CXWKWNJ
        TARGETED_DEVICE_FAMILY: "1"

  WaymateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Waymate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhengxiaohua.waymate.test2026.uitests
        SWIFT_VERSION: 5.0
        TEST_TARGET_NAME: Waymate
        GENERATE_INFOPLIST_FILE: YES

  WaymateUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
      - path: ../../shared/demo_fixture/jinan_map_scene_sample.json
        buildPhase: resources
    dependencies:
      - target: Waymate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhengxiaohua.waymate.test2026.unittests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Waymate.app/Waymate
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Waymate:
    build:
      targets:
        Waymate: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - WaymateUnitTests
        - WaymateUITests
